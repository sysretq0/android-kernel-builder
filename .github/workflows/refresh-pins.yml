name: refresh-pins
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - run: python3 tools/refresh-pins.py --write
      - run: |
          if git diff --quiet; then
            echo "pins current; nothing to push"
            exit 0
          fi
          git -c user.name="android-kernel-builder" -c user.email="builder@localhost" \
            commit -qm "pins: refresh to upstream tips $(date -u +%F)"
          git push origin HEAD:main
