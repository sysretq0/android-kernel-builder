name: mirror-android-common-lts

# Full-history mirror of android.googlesource.com/kernel/common LTS branches
# into sysretq0/android-kernel-common-lts.
# - Whole history (no shallow, no filter, no squash)
# - No force push anywhere (no '+' refspecs, no --force; fails safe)
# - Preserves tags + commit metadata bit-for-bit (pure fetch + push)
# - 8 branches sync in parallel (matrix, one distinct ref per job = no lock races)
# - Chunked bootstrap pushes stay under GitHub's 2GB single-push limit
# - Tags: only tags reachable from the 8 branches (one walk, then push once)

on:
  schedule:
    # Daily 02:30 UTC. Tune as needed.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-android-common-lts
  cancel-in-progress: false

permissions:
  contents: read # only needs read here; push to DEST uses KERNEL_MIRROR_TOKEN

jobs:
  sync-branch:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - android12-5.10-lts
          - android13-5.10-lts
          - android13-5.15-lts
          - android14-5.15-lts
          - android14-6.1-lts
          - android15-6.6-lts
          - android16-6.12-lts
          - android17-6.18-lts
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UPSTREAM_URL: https://android.googlesource.com/kernel/common
      DEST_REPO: sysretq0/android-kernel-common
      BRANCH: ${{ matrix.branch }}
    steps:
      - name: Mirror one branch (full history, fast-forward only, chunked)
        env:
          DEST_TOKEN: ${{ secrets.KERNEL_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEST_TOKEN:-}" ]; then
            echo "::error::Missing secret KERNEL_MIRROR_TOKEN."
            exit 1
          fi
          B="$BRANCH"

          rm -rf mirror.git
          git init --bare -q mirror.git
          cd mirror.git
          git remote add upstream "$UPSTREAM_URL"
          git remote add dest "https://x-access-token:${DEST_TOKEN}@github.com/${DEST_REPO}.git"

          # Full history: no --depth, no --filter, no --shallow.
          git fetch --no-tags --prune upstream "refs/heads/$B:refs/remotes/upstream/$B"
          TIP=$(git rev-parse "refs/remotes/upstream/$B")
          echo "upstream $B = $TIP"

          BATCH=20000
          if git fetch dest "refs/heads/$B:refs/remotes/dest/$B" 2>/dev/null; then
            DEST="refs/remotes/dest/$B"
            if ! git merge-base --is-ancestor "$DEST" "$TIP"; then
              echo "::error::$B on dest is not an ancestor of upstream tip — refusing (no force)."
              exit 1
            fi
            RANGE="$DEST..$TIP"
          else
            echo "bootstrap: $B missing on dest, pushing full history in chunks"
            RANGE="$TIP"
          fi

          COUNT=$(git rev-list --first-parent --count "$RANGE")
          echo "commits to push: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "already up to date"
            exit 0
          fi

          # Push first-parent history in batches so each single push stays far
          # under GitHub's 2GB limit (oversized single pushes die with HTTP 500
          # on git-receive-pack). First-parent order guarantees every step is a
          # fast-forward of the previous. No '+' anywhere. Each chunk retried
          # 3x with backoff for transient 500s; a resume just continues the
          # range on the next run (dest tip stays a valid ancestor).
          git rev-list --first-parent --reverse "$RANGE" > all.txt
          TOTAL_LINES=$(wc -l < all.txt)
          awk -v n=$BATCH 'NR % n == 0 { print NR }' all.txt > idx.txt
          echo "$TOTAL_LINES" >> idx.txt
          sort -nu idx.txt -o idx.txt

          push_one() {
            s="$1"
            # Idempotent: already-contained SHAs are a skip, not a failure.
            # (Keeps re-walks and resume-from-partial safe under no-force.)
            if git rev-parse --verify -q "refs/remotes/dest/$B" >/dev/null; then
              if git merge-base --is-ancestor "$s" "refs/remotes/dest/$B"; then
                echo "  skip $s (already on dest)"
                return 0
              fi
            fi
            a=0
            while [ "$a" -lt 3 ]; do
              a=$((a + 1))
              echo "  push $s (attempt $a)"
              if git push dest "$s:refs/heads/$B"; then
                git update-ref "refs/remotes/dest/$B" "$s"
                return 0
              fi
              if [ "$a" -lt 3 ]; then sleep $((a * 60)); fi
            done
            return 1
          }

          push_window() { # $1 start_line $2 end_line $3 step
            l=$1; e=$2; st=$3
            while [ "$l" -lt "$e" ]; do
              l=$((l + st)); if [ "$l" -gt "$e" ]; then l=$e; fi
              s=$(sed -n "${l}p" all.txt)
              if ! push_one "$s"; then return 1; fi
            done
            return 0
          }

          prev=0
          while read -r idx; do
            s=$(sed -n "${idx}p" all.txt)
            echo "== chunk @ line $idx/$TOTAL_LINES $s"
            if push_one "$s"; then prev=$idx; continue; fi
            echo "chunk failed, subdividing $prev..$idx at 2000-commit granularity"
            if push_window "$prev" "$idx" 2000; then prev=$idx; continue; fi
            echo "still failing, subdividing $prev..$idx at 200-commit granularity"
            if push_window "$prev" "$idx" 200; then prev=$idx; continue; fi
            echo "::error::unpushable window lines $prev..$idx"
            exit 1
          done < idx.txt
          echo "done $B = $(git ls-remote dest "refs/heads/$B")"

  publish-tags:
    needs: [sync-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UPSTREAM_URL: https://android.googlesource.com/kernel/common
      DEST_REPO: sysretq0/android-kernel-common
    steps:
      - name: Mirror reachable tags only (new tags, no --force)
        env:
          DEST_TOKEN: ${{ secrets.KERNEL_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEST_TOKEN:-}" ]; then
            echo "::error::Missing secret KERNEL_MIRROR_TOKEN."
            exit 1
          fi

          BRANCHES=(
            android12-5.10-lts
            android13-5.10-lts
            android13-5.15-lts
            android14-5.15-lts
            android14-6.1-lts
            android15-6.6-lts
            android16-6.12-lts
            android17-6.18-lts
          )

          rm -rf tags.git
          git init --bare -q tags.git
          cd tags.git
          git remote add upstream "$UPSTREAM_URL"
          git remote add dest "https://x-access-token:${DEST_TOKEN}@github.com/${DEST_REPO}.git"

          TIPS=()
          for b in "${BRANCHES[@]}"; do
            git fetch --no-tags upstream "refs/heads/$b:refs/remotes/upstream/$b"
            TIPS+=("refs/remotes/upstream/$b")
          done
          git fetch upstream "refs/tags/*:refs/tags/*" || true
          echo "tags upstream: $(git tag | wc -l)"

          # ONE reachability walk across all 8 tips (no per-tag-per-branch cost).
          git rev-list "${TIPS[@]}" | sort -u > reachable.txt

          # Resolve every tag to its commit in a single for-each-ref pass
          # (peeled object for annotated tags, own object for lightweight).
          git for-each-ref --format='%(refname) %(*objectname) %(objectname)' refs/tags |
            awk '{ c=($2 != "") ? $2 : $3; print c " " $1 }' > tagmap.txt
          cut -d' ' -f1 tagmap.txt | sort -u > tagcommits.txt
          grep -Fxf reachable.txt tagcommits.txt > keep.txt || true
          awk 'NR == FNR { keep[$1] = 1; next } ($1 in keep) { print $2 ":" $2 }' keep.txt tagmap.txt > specs.txt
          echo "reachable tags: $(wc -l < specs.txt)"

          # Push in batches, once (not per-branch), without --force:
          # existing tags never move, new ones are added. Commits are already
          # on dest (branches synced first), so only tag objects travel.
          if [ -s specs.txt ]; then
            xargs -a specs.txt -n 200 git push --verbose dest
          fi
          echo done

  merge-stable:
    needs: [sync-branch]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lts: android12-5.10-lts
            stable: linux-5.10.y
          - lts: android13-5.10-lts
            stable: linux-5.10.y
          - lts: android13-5.15-lts
            stable: linux-5.15.y
          - lts: android14-5.15-lts
            stable: linux-5.15.y
          - lts: android14-6.1-lts
            stable: linux-6.1.y
          - lts: android15-6.6-lts
            stable: linux-6.6.y
          - lts: android16-6.12-lts
            stable: linux-6.12.y
          - lts: android17-6.18-lts
            stable: linux-6.18.y
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UPSTREAM_URL: https://android.googlesource.com/kernel/common
      STABLE_URL: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      DEST_REPO: sysretq0/android-kernel-common
      LTS: ${{ matrix.lts }}
      STABLE: ${{ matrix.stable }}
    steps:
      - name: Merge stable into LTS, force-with-lease (rebuilt, no own history)
        env:
          DEST_TOKEN: ${{ secrets.KERNEL_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEST_TOKEN:-}" ]; then
            echo "::error::Missing secret KERNEL_MIRROR_TOKEN."
            exit 1
          fi
          OUT="${LTS/-lts/-stable}"
          echo "LTS=$LTS STABLE=$STABLE OUT=$OUT"

          # Skip cleanly if this .y line doesn't exist yet (e.g. linux-6.18.y).
          if ! git ls-remote "$STABLE_URL" "refs/heads/$STABLE" | grep -q .; then
            echo "::warning::$STABLE not found in stable tree — skipping $OUT."
            exit 0
          fi

          rm -rf work && mkdir work && cd work
          git init -q
          git remote add upstream "$UPSTREAM_URL"
          git remote add stable "$STABLE_URL"
          git remote add dest "https://x-access-token:${DEST_TOKEN}@github.com/${DEST_REPO}.git"

          git fetch --no-tags upstream "refs/heads/$LTS:refs/remotes/upstream/$LTS"
          git fetch --no-tags stable "refs/heads/$STABLE:refs/remotes/stable/$STABLE"
          LTS_TIP=$(git rev-parse "refs/remotes/upstream/$LTS")
          STABLE_TIP=$(git rev-parse "refs/remotes/stable/$STABLE")
          echo "LTS tip: $LTS_TIP"
          echo "stable tip: $STABLE_TIP"

          # Lease base: current OUT ref on dest (empty = expect nonexistent).
          OLD=""
          if git fetch dest "refs/heads/$OUT:refs/remotes/dest/$OUT" 2>/dev/null; then
            OLD=$(git rev-parse "refs/remotes/dest/$OUT")
            echo "dest $OUT now at $OLD"
          else
            echo "dest $OUT does not exist yet"
          fi

          git -c user.name="kernel-mirror" -c user.email="kernel-mirror@users.noreply.github.com" checkout -q "$LTS_TIP"
          if git -c user.name="kernel-mirror" -c user.email="kernel-mirror@users.noreply.github.com" merge --no-ff --no-edit \
              -m "Merge $STABLE ($STABLE_TIP) into $LTS ($LTS_TIP)" "$STABLE_TIP"; then
            echo "merged clean"
          else
            echo "::error::merge conflict $STABLE into $LTS — aborting, no push. Resolve manually."
            git merge --abort || true
            exit 1
          fi
          MERGED=$(git rev-parse HEAD)
          echo "merged: $MERGED"

          if [ -n "$OLD" ] && [ "$OLD" = "$MERGED" ]; then
            echo "already up to date"
            exit 0
          fi

          # Rebuilt every run: -stable carries no history of its own, so this
          # always needs force — but strictly with lease (fails if someone
          # moved the ref since we fetched OLD). Distinct ref per matrix job.
          if [ -n "$OLD" ]; then
            LEASE="--force-with-lease=refs/heads/$OUT:$OLD"
          else
            LEASE="--force-with-lease=refs/heads/$OUT:"
          fi
          # shellcheck disable=SC2086
          git push --verbose $LEASE dest "HEAD:refs/heads/$OUT"
          echo done
