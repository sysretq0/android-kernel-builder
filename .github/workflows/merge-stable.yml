name: merge-stable

# LTS + Greg KH stable merges -> -stable branches (rebuilt, no own history).
# Standalone from the mirror workflow: fetches upstream tips directly.
# - Clean merge still goes through the supervisor (mergable != compatible).
# - APPROVE -> -stable (force-with-lease), FLAG/error -> -stable-review + issue.
# - Minimax defaults while free (resolver m2.7, supervisor m3).

on:
  schedule:
    # After the mirror (02:30 UTC) so LTS tips are fresh.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      resolver_model:
        description: "OpenRouter model for merge agent (empty = :free default)"
        required: false
        default: "minimax/minimax-m2.7:free"
      supervisor_model:
        description: "OpenRouter model for supervisor review (empty = :free default)"
        required: false
        default: "minimax/minimax-m3:free"
      force:
        description: "Bypass change/attempt gates (retry quarantined inputs)"
        type: boolean
        default: false

concurrency:
  group: merge-stable
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # quarantine issues on FLAG / AI failure

env:
  DEFAULT_AI_MODEL: minimax/minimax-m3:free

jobs:
  merge-stable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lts: android12-5.10-lts
            stable: linux-5.10.y
          - lts: android13-5.10-lts
            stable: linux-5.10.y
          - lts: android13-5.15-lts
            stable: linux-5.15.y
          - lts: android14-5.15-lts
            stable: linux-5.15.y
          - lts: android14-6.1-lts
            stable: linux-6.1.y
          - lts: android15-6.6-lts
            stable: linux-6.6.y
          - lts: android16-6.12-lts
            stable: linux-6.12.y
          - lts: android17-6.18-lts
            stable: linux-6.18.y
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UPSTREAM_URL: https://android.googlesource.com/kernel/common
      STABLE_URL: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      DEST_REPO: sysretq0/android-kernel-common
      LTS: ${{ matrix.lts }}
      STABLE: ${{ matrix.stable }}
      RESOLVER_MODEL: ${{ inputs.resolver_model }}
      SUPERVISOR_MODEL: ${{ inputs.supervisor_model }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Checkout builder (AI harness tools)
        uses: actions/checkout@v4
        with:
          path: builder
      - name: Merge stable into LTS, force-with-lease (rebuilt, no own history)
        env:
          DEST_TOKEN: ${{ secrets.KERNEL_MIRROR_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # quarantine issues need it in env (issues:write granted above)
        run: |
          set -euo pipefail
          if [ -z "${DEST_TOKEN:-}" ]; then
            echo "::error::Missing secret KERNEL_MIRROR_TOKEN."
            exit 1
          fi
          OUT="${LTS/-lts/-stable}"
          REVIEW_OUT="${OUT}-review"
          # Cron has no inputs (both empty) -> :free default. Manual dispatch
          # pre-fills resolver=m2.7:free, supervisor=m3:free; edit either box.
          RESOLVER_EFF="${RESOLVER_MODEL:-$DEFAULT_AI_MODEL}"
          SUPERVISOR_EFF="${SUPERVISOR_MODEL:-$DEFAULT_AI_MODEL}"
          TOOLS="$GITHUB_WORKSPACE/builder/tools"
          echo "LTS=$LTS STABLE=$STABLE OUT=$OUT REVIEW=$REVIEW_OUT RESOLVER=$RESOLVER_EFF SUPERVISOR=$SUPERVISOR_EFF"

          # Skip cleanly if this .y line doesn't exist yet (e.g. linux-6.18.y).
          if ! git ls-remote "$STABLE_URL" "refs/heads/$STABLE" | grep -q .; then
            echo "::warning::$STABLE not found in stable tree — skipping $OUT."
            exit 0
          fi

          rm -rf work && mkdir work && cd work
          git init -q
          git remote add upstream "$UPSTREAM_URL"
          git remote add stable "$STABLE_URL"
          git remote add dest "https://x-access-token:${DEST_TOKEN}@github.com/${DEST_REPO}.git"

          git fetch --no-tags upstream "refs/heads/$LTS:refs/remotes/upstream/$LTS"
          git fetch --no-tags stable "refs/heads/$STABLE:refs/remotes/stable/$STABLE"
          LTS_TIP=$(git rev-parse "refs/remotes/upstream/$LTS")
          STABLE_TIP=$(git rev-parse "refs/remotes/stable/$STABLE")
          OURS_MSG=$(git log -1 --format=%s "$LTS_TIP")
          THEIRS_MSG=$(git log -1 --format=%s "$STABLE_TIP")
          echo "LTS tip: $LTS_TIP ($OURS_MSG)"
          echo "stable tip: $STABLE_TIP ($THEIRS_MSG)"

          # Lease bases: current OUT + REVIEW refs on dest (empty = expect nonexistent).
          OLD=""
          if git fetch dest "refs/heads/$OUT:refs/remotes/dest/$OUT" 2>/dev/null; then
            OLD=$(git rev-parse "refs/remotes/dest/$OUT")
            echo "dest $OUT now at $OLD"
          else
            echo "dest $OUT does not exist yet"
          fi

          # Change gate: OUT already contains both inputs -> nothing to merge.
          # Pure reachability, so AI fixup commits / quarantines can't fool it;
          # any uncertainty exits non-zero and falls through to a full run.
          if [ "$FORCE" != "true" ] && [ -n "$OLD" ] && git merge-base --is-ancestor "$LTS_TIP" "refs/remotes/dest/$OUT" 2>/dev/null \
              && git merge-base --is-ancestor "$STABLE_TIP" "refs/remotes/dest/$OUT" 2>/dev/null; then
            echo "$OUT ($OLD) already contains LTS $LTS_TIP + $STABLE_TIP; skipping"
            exit 0
          fi

          # Attempt memory: same inputs already quarantined -> don't reburn AI.
          # Open issues are the store (no push races, no token widening); the
          # HTML trailer is invisible when rendered. Close the issue or
          # force=true to retry. Any tooling failure falls through to a run.
          TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ "$FORCE" != "true" ] && GH_TOKEN="$TOKEN" gh issue list --repo "$DEST_REPO" --state open --limit 50 \
              --json title,body --jq '.[] | select(.title | contains("['$OUT']")) | .body' 2>/dev/null \
              | grep -qF "<!-- merge-state OUT=$OUT LTS_TIP=$LTS_TIP STABLE_TIP=$STABLE_TIP -->"; then
            echo "$OUT already quarantined for LTS $LTS_TIP + $STABLE_TIP; skipping (close the issue or force=true to retry)"
            exit 0
          fi
          OLD_REVIEW=""
          if git fetch dest "refs/heads/$REVIEW_OUT:refs/remotes/dest/$REVIEW_OUT" 2>/dev/null; then
            OLD_REVIEW=$(git rev-parse "refs/remotes/dest/$REVIEW_OUT")
          fi

          push_ref() { # $1 local_sha $2 ref $3 old(allow empty)
            local sha=$1 ref=$2 old=$3 lease
            if [ -n "$old" ]; then lease="--force-with-lease=refs/heads/$ref:$old";
            else lease="--force-with-lease=refs/heads/$ref:"; fi
            # shellcheck disable=SC2086
            git push --verbose $lease dest "$sha:refs/heads/$ref"
          }

          quarantine() { # $1 reason_file $2 title
            local reason=$1 title=$2 rlease=""
            echo "QUARANTINE: $title"
            cat "$reason" 2>/dev/null || true
            echo "<!-- merge-state OUT=$OUT LTS_TIP=$LTS_TIP STABLE_TIP=$STABLE_TIP -->" >> "$reason"
            MERGED=$(git rev-parse HEAD)
            if [ -n "$OLD_REVIEW" ]; then rlease="--force-with-lease=refs/heads/$REVIEW_OUT:$OLD_REVIEW";
            else rlease="--force-with-lease=refs/heads/$REVIEW_OUT:"; fi
            # shellcheck disable=SC2086
            git push --verbose $rlease dest "$MERGED:refs/heads/$REVIEW_OUT" || true
            if [ -n "${GH_TOKEN:-}" ] || [ -n "${GITHUB_TOKEN:-}" ]; then
              TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
              GH_TOKEN="$TOKEN" gh issue create --repo "$DEST_REPO" \
                --title "$title" --body-file "$reason" 2>/dev/null || true
            fi
          }

          git -c user.name="kernel-mirror" -c user.email="kernel-mirror@users.noreply.github.com" checkout -q "$LTS_TIP"
          MERGE_MODE="clean"
          if git -c user.name="kernel-mirror" -c user.email="kernel-mirror@users.noreply.github.com" merge --no-ff --no-edit \
              -m "Merge $STABLE ($STABLE_TIP) into $LTS ($LTS_TIP)" "$STABLE_TIP"; then
            echo "merged clean"
          else
            echo "conflict path: $STABLE into $LTS"
            MERGE_MODE="ai"
            git diff --name-only --diff-filter=U > /tmp/conflicted.txt || true
            NCONF=$(wc -l < /tmp/conflicted.txt)
            echo "conflicted files: $NCONF"
            if [ "$NCONF" -gt 20 ]; then
              git merge --abort || true
              git -c user.name="kernel-mirror" -c user.email="kernel-mirror@users.noreply.github.com" checkout -q "$LTS_TIP"
              git -c user.name="kernel-mirror" -c user.email="kernel-mirror@users.noreply.github.com" merge --no-ff --no-edit \
                -m "Merge $STABLE ($STABLE_TIP) into $LTS ($LTS_TIP) [quarantine: too many conflicts]" "$STABLE_TIP" || true
              { echo "Too many conflicted files ($NCONF > 20), needs human. LTS=$LTS_TIP stable=$STABLE_TIP"; echo; cat /tmp/conflicted.txt; } > /tmp/quarantine.md
              quarantine /tmp/quarantine.md "[$OUT] $NCONF-way conflict, needs human ($LTS + $STABLE)"
              exit 0
            fi
            if [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "::error::conflict needs AI but OPENROUTER_API_KEY is missing — quarantining unmerged state as issue only."
              git merge --abort || true
              { echo "Merge $STABLE ($STABLE_TIP) into $LTS ($LTS_TIP) conflicted in $NCONF files but no OPENROUTER_API_KEY is configured."; echo; cat /tmp/conflicted.txt; } > /tmp/quarantine.md
              echo "<!-- merge-state OUT=$OUT LTS_TIP=$LTS_TIP STABLE_TIP=$STABLE_TIP -->" >> /tmp/quarantine.md
              TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
              if [ -n "$TOKEN" ]; then GH_TOKEN="$TOKEN" gh issue create --repo "$DEST_REPO" --title "[$OUT] conflict, no AI key" --body-file /tmp/quarantine.md || true; fi
              exit 1
            fi
            # Deterministic pre-pass: root Makefile version bump -> take stable side whole.
            # (stable only bumps VERSION/PATCHLEVEL/SUBLEVEL/EXTRAVERSION there.)
            if grep -qx "Makefile" /tmp/conflicted.txt 2>/dev/null; then
              echo "pre-pass: Makefile takes --theirs"
              git checkout --theirs -- Makefile
              git add Makefile
            fi
            grep -vx "Makefile" /tmp/conflicted.txt > /tmp/ai_files.txt || true
            : > /tmp/ai_failed.txt
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! AI_MODEL="$RESOLVER_EFF" python3 "$TOOLS/ai-resolve.py" --file "$f" --ours-msg "$OURS_MSG" --theirs-msg "$THEIRS_MSG"; then
                echo "$f" >> /tmp/ai_failed.txt
              else
                # Stage immediately: without this the file stays state U and
                # the unmerged-paths gate below trips on our own output.
                git add -- "$f"
              fi
            done < /tmp/ai_files.txt
            if [ -s /tmp/ai_failed.txt ]; then
              echo "::error::AI failed on: $(cat /tmp/ai_failed.txt)"
              git merge --abort || true
              { echo "AI resolver failed on $LTS + $STABLE. Files:"; echo; cat /tmp/ai_failed.txt; } > /tmp/quarantine.md
              echo "<!-- merge-state OUT=$OUT LTS_TIP=$LTS_TIP STABLE_TIP=$STABLE_TIP -->" >> /tmp/quarantine.md
              TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
              if [ -n "$TOKEN" ]; then GH_TOKEN="$TOKEN" gh issue create --repo "$DEST_REPO" --title "[$OUT] AI resolve failed" --body-file /tmp/quarantine.md || true; fi
              exit 1
            fi
            # Gates: no unmerged paths, no markers, diff --check clean.
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::unmerged paths remain"; git diff --name-only --diff-filter=U; exit 1
            fi
            if grep -rIn --exclude-dir=.git -E '^(<{7}|={7}|>{7})' . 2>/dev/null | grep -q .; then
              echo "::error::conflict markers escaped"; grep -rIn --exclude-dir=.git -E '^(<{7}|={7}|>{7})' . | head; exit 1
            fi
            git add -A
            git diff --cached --check || { echo "::error::whitespace errors"; exit 1; }
            git -c user.name="kernel-mirror" -c user.email="kernel-mirror@users.noreply.github.com" commit --no-edit
            echo "AI-resolved commit: $(git rev-parse HEAD)"
          fi
          MERGED=$(git rev-parse HEAD)
          echo "merged: $MERGED (mode=$MERGE_MODE)"

          if [ -n "$OLD" ] && [ "$OLD" = "$MERGED" ]; then
            echo "already up to date"
            exit 0
          fi

          # Backup tag on previous tip before any force-with-lease push.
          if [ -n "$OLD" ]; then
            git tag "prev-$OUT-$GITHUB_RUN_ID" "$OLD" || true
            git push dest "refs/tags/prev-$OUT-$GITHUB_RUN_ID" || true
          fi

          # Supervisor runs on EVERY merge, clean or AI: mergable != compatible.
          # No key + clean keeps old behavior (push straight); AI merge without
          # a key can never be supervised, so it fails closed.
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            if [ "$MERGE_MODE" = "clean" ]; then
              push_ref "$MERGED" "$OUT" "$OLD"
              echo done
              exit 0
            fi
            echo "::error::AI merge without key cannot be supervised"; exit 1
          fi
          git diff "$LTS_TIP...$MERGED" > /tmp/merge.diff || true
          # ABI tripwire: any android/abi_* delta auto-flags regardless of supervisor.
          ABI_HIT=""
          if git diff --name-only "$LTS_TIP...$MERGED" | grep -q "^android/abi_"; then ABI_HIT="android/abi_ changed"; fi
          set +e
          AI_MODEL="$SUPERVISOR_EFF" python3 "$TOOLS/supervise.py" --diff /tmp/merge.diff --lts "$LTS" --stable "$STABLE" | tee /tmp/verdict.txt
          SUP=$?
          set -e
          { echo "LTS=$LTS ($LTS_TIP)"; echo "stable=$STABLE ($STABLE_TIP)"; echo "merged=$MERGED mode=$MERGE_MODE"; echo "abi: ${ABI_HIT:-none}"; echo; echo "--- supervisor (exit $SUP) ---"; cat /tmp/verdict.txt; echo; echo "--- files ---"; git diff --name-only "$LTS_TIP...$MERGED"; } > /tmp/super.md
          if [ -n "$ABI_HIT" ]; then echo "ABI tripwire hit: $ABI_HIT — forcing quarantine"; SUP=10; fi
          if [ "$SUP" -eq 0 ]; then
            echo "supervisor APPROVE -> $OUT"
            push_ref "$MERGED" "$OUT" "$OLD"
          else
            echo "supervisor FLAG (exit $SUP) -> $REVIEW_OUT"
            quarantine /tmp/super.md "[$OUT] supervisor FLAG ($LTS + $STABLE)"
          fi
          echo done
