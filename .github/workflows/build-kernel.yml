name: build-kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (or 'all')"
        default: "all"
      our_revision:
        description: "Override common revision (default: per-branch -stable, fallback -lts)"
        default: ""
      extra_config:
        description: "Inline CONFIG lines for this run only, comma-separated (e.g. 'CONFIG_TCP_CONG_BBR=y')"
        default: ""
      ksu:
        description: "Integrate pershoot/KernelSU-Next driver"
        type: boolean
        default: true
      ksu_ref:
        description: "KernelSU-Next tag/commit (default: latest tag)"
        default: ""
      nomount:
        description: "Integrate maxsteeel/nomount VFS subsystem"
        type: boolean
        default: true
      nomount_ref:
        description: "NoMount branch/tag/commit (default: dev branch)"
        default: ""
      guard:
        description: "Integrate Partition Guard LSM (NVRAM/persist/EFS)"
        type: boolean
        default: true
      guard_ref:
        description: "Partition Guard branch/tag/commit (default: main)"
        default: ""
  schedule:
    - cron: "0 5 * * 0" # weekly Sunday 05:00 UTC

jobs:
  # Pre-filter the build matrix so only requested branches spawn jobs.
  # Empty input (schedule) or 'all' = build everything.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          ONLY: ${{ inputs.branch }}
        run: |
          ALL='{"include":[
            {"our_branch":"android12-5.10-stable","fallback_branch":"android12-5.10-lts","manifest_branch":"common-android12-5.10-lts","build_kind":"build_sh"},
            {"our_branch":"android13-5.10-stable","fallback_branch":"android13-5.10-lts","manifest_branch":"common-android13-5.10-lts","build_kind":"build_sh"},
            {"our_branch":"android13-5.15-stable","fallback_branch":"android13-5.15-lts","manifest_branch":"common-android13-5.15-lts","build_kind":"build_sh"},
            {"our_branch":"android14-5.15-stable","fallback_branch":"android14-5.15-lts","manifest_branch":"common-android14-5.15-lts","build_kind":"kleaf"},
            {"our_branch":"android14-6.1-stable","fallback_branch":"android14-6.1-lts","manifest_branch":"common-android14-6.1-lts","build_kind":"kleaf"},
            {"our_branch":"android15-6.6-stable","fallback_branch":"android15-6.6-lts","manifest_branch":"common-android15-6.6-lts","build_kind":"kleaf"},
            {"our_branch":"android16-6.12-stable","fallback_branch":"android16-6.12-lts","manifest_branch":"common-android16-6.12-lts","build_kind":"kleaf"},
            {"our_branch":"android17-6.18-stable","fallback_branch":"android17-6.18-lts","manifest_branch":"common-android17-6.18-lts","build_kind":"kleaf"}
          ]}'
          # Build methods: build.sh for 5.10 + android13-5.15 (era-default),
          # Kleaf (tools/bazel) for android14-5.15 and newer.
          if [ -z "$ONLY" ] || [ "$ONLY" = "all" ]; then
            echo "matrix=$(echo "$ALL" | jq -c .)" >>"$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$ALL" | jq -c --arg o "$ONLY" '{include: [.include[] | select(.our_branch==$o or .fallback_branch==$o)]}')" >>"$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout builder (for manifest template)
        uses: actions/checkout@v4
        with:
          path: builder

      # Throwaway runner: nuke preinstalled SDK/toolchain trees directly
      # (vendored from CloudFox-Kernel-Builder, no third-party action).
      # Full kernel tree + prebuilts + bazel cache need tens of GB.
      - name: Free disk space
        run: |
          sudo bash "$GITHUB_WORKSPACE/builder/tools/free-disk-space.sh"
          df -h

      # Kernel link far exceeds the 16GB runner RAM; 24G swap keeps
      # LD/BTF/clang from OOM-killing (same as CloudFox).
      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Resolve common revision: use our -stable branch if the merge has
      # landed, else fall back to the mirrored -lts tip. Manual dispatch
      # can force any revision via the our_revision input.
      - name: Pick revision (stable if exists, else LTS)
        id: rev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ inputs.our_revision }}
          WANT: ${{ matrix.our_branch }}
          FALLBACK: ${{ matrix.fallback_branch }}
        run: |
          if [ -n "$OVERRIDE" ]; then REV="$OVERRIDE"; else
            if git ls-remote --heads "https://github.com/sysretq0/android-kernel-common" "$WANT" | grep -q .; then REV="$WANT"; else REV="$FALLBACK"; fi
          fi
          echo "rev=$REV" >>"$GITHUB_OUTPUT"
          echo "Building common@$REV"

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin && curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo && echo "$HOME/.bin" >>"$GITHUB_PATH"

      - name: repo init + vendor our common
        run: |
          mkdir -p kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b "${{ matrix.manifest_branch }}" --depth=1
          mkdir -p .repo/local_manifests
          sed "s/__REVISION__/${{ steps.rev.outputs.rev }}/" "$GITHUB_WORKSPACE/builder/manifests/vendor-common.xml.template" > .repo/local_manifests/vendor-common.xml
          cat .repo/local_manifests/vendor-common.xml

      - name: repo sync (minimal)
        run: |
          cd kernel
          repo sync -c -j$(nproc) --no-tags --fail-fast

      # KernelSU-Next (pershoot fork): full clone (.git preserved, the
      # installer needs stash/pull/describe), pin via ksu_ref or latest tag,
      # symlink into common/drivers + Kconfig/Makefile hooks. Writes
      # .fragments/kernelsu.config, picked up by the Apply step below.
      - name: Integrate KernelSU-Next
        if: inputs.ksu != false
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-kernelsu-next.sh" --ref "${{ inputs.ksu_ref }}"

      # NoMount: same pattern (full clone, installer pins, symlink into
      # common/fs + Makefile/Kconfig hooks, .fragments/nomount.config).
      - name: Integrate NoMount
        if: inputs.nomount != false
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-nomount.sh" --ref "${{ inputs.nomount_ref }}"

      # Partition Guard (own LSM): symlink into common/security + Makefile /
      # Kconfig / LSM-list hooks. Writes .fragments/guard.config.
      - name: Integrate Partition Guard
        if: inputs.guard != false
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-partition-guard.sh" --ref "${{ inputs.guard_ref }}"

      # Portable config injection, per era:
      # - build.sh: merge fragments/common + fragments/<our_branch> (+ extra
      #   .fragments) INTO gki_defconfig; self-heal re-canonicalizes after.
      # - Kleaf: base defconfig must stay PRISTINE (stock check_defconfig runs
      #   as its POST hook); fragments ride --defconfig_fragment instead.
      # No fragments present = stock defconfig, these steps are no-ops.
      - name: Apply config fragments (build.sh era)
        if: matrix.build_kind == 'build_sh'
        run: |
          cd kernel
          ARGS=(--kernel-dir common)
          [ -d "$GITHUB_WORKSPACE/builder/fragments/common" ] &&
            ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/common")
          [ -d "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}" ] &&
            ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}")
          [ -n "${{ inputs.extra_config }}" ] &&
            ARGS+=(--extra-config "${{ inputs.extra_config }}")
          # Generated fragments (KSU/NoMount): only present when that step ran.
          [ -d .fragments ] && ARGS+=(--fragment-dir .fragments)
          bash "$GITHUB_WORKSPACE/builder/tools/apply-fragments.sh" "${ARGS[@]}"

      - name: Stage Kleaf fragments
        id: kleaf_frag
        if: matrix.build_kind == 'kleaf'
        run: |
          cd kernel
          ARGS=(--kernel-dir common)
          [ -d "$GITHUB_WORKSPACE/builder/fragments/common" ] &&
            ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/common")
          [ -d "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}" ] &&
            ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}")
          [ -n "${{ inputs.extra_config }}" ] &&
            ARGS+=(--extra-config "${{ inputs.extra_config }}")
          [ -d .fragments ] && ARGS+=(--fragment-dir .fragments)
          bash "$GITHUB_WORKSPACE/builder/tools/stage-kleaf-fragments.sh" "${ARGS[@]}"
          [ -f common/builder_fragments.config ] && echo "has=true" >>"$GITHUB_OUTPUT" || echo "has=false" >>"$GITHUB_OUTPUT"

      # setlocalversion stamps -dirty on ANY uncommitted change at compile
      # time, so commit the whole tree before building. Self-heal does the
      # same at its end (build.sh path); this covers Kleaf + everything else.
      - name: Commit tree (avoid -dirty version)
        run: |
          cd kernel
          if [ -d common/.git ]; then
            git -C common add -A 2>/dev/null || true
            git -C common diff --cached --quiet 2>/dev/null || \
              git -C common -c user.name="android-kernel-builder" \
                -c user.email="builder@localhost" \
                commit -qm "builder: commit tree before build (avoid -dirty)" || true
            git -C common status --short | head -5
          fi

      # build.sh only: check_defconfig requires the committed defconfig to
      # byte-match canonical savedefconfig, so fragment injection must be
      # followed by the self-heal stage (vendored from CloudFox) as
      # POST_DEFCONFIG_CMDS. Kleaf needs nothing extra (order-insensitive).
      - name: Prepare portable build config (build.sh era)
        if: matrix.build_kind == 'build_sh'
        run: |
          cd kernel
          cp "$GITHUB_WORKSPACE/builder/tools/self-heal-config.sh" build/self-heal-config.sh
          chmod +x build/self-heal-config.sh
          cat > build.config.portable <<'EOF'
          export KERNEL_DIR=common
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64
          export POST_DEFCONFIG_CMDS='${ROOT_DIR}/build/self-heal-config.sh'
          EOF
          cat build.config.portable

      - name: Build (build.sh era)
        if: matrix.build_kind == 'build_sh'
        run: |
          cd kernel
          BUILD_CONFIG=build.config.portable build/build.sh

      - name: Build (Kleaf era)
        if: matrix.build_kind == 'kleaf'
        run: |
          cd kernel
          FLAG=""
          [ "${{ steps.kleaf_frag.outputs.has }}" = "true" ] &&
            FLAG="--defconfig_fragment=//common:builder_fragments"
          # shellcheck disable=SC2086
          tools/bazel build $FLAG //common:kernel_aarch64_dist

      - name: Collect outputs
        run: |
          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}"
          # build.sh era drops into out/ ; Kleaf into bazel-bin/common/
          for f in $(find out bazel-bin/common -maxdepth 4 \( -name "Image*" -o -name "vmlinux" -o -name "System.map" \) 2>/dev/null | head -n 20); do
            cp -v "$f" "$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}/" 2>/dev/null || true
          done
          ls -la "$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}/"

      - name: Pack AnyKernel3 zip
        run: |
          OUT="$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}"
          IMG=""
          for cand in Image.lz4 Image.gz Image; do
            [ -f "$OUT/$cand" ] && IMG="$OUT/$cand" && break
          done
          [ -n "$IMG" ] || { echo "no kernel image for AK3 zip; skipping"; exit 0; }
          bash "$GITHUB_WORKSPACE/builder/tools/pack-anykernel.sh" \
            --image "$IMG" --rev "${{ steps.rev.outputs.rev }}" \
            --out "$OUT/anykernel-${{ steps.rev.outputs.rev }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.rev.outputs.rev }}
          path: out-${{ steps.rev.outputs.rev }}/
          if-no-files-found: warn
