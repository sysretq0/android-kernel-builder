# SPDX-License-Identifier: GPL-3.0-only
name: build-kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant from variants/ (per-version model)"
        default: "plain"
        type: choice
        options: [plain, susfs]
      branch:
        description: "Branch to build (or 'all')"
        default: "all"
      release:
        description: "Publish AnyKernel3 zips to GitHub Release + Telegram (false = artifacts only)"
        type: boolean
        default: false
      forward:
        description: "Forward the Telegram announcement to forward targets (default off)"
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"

permissions:
  actions: write
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
      our_revision: ${{ steps.v.outputs.our_revision }}
      ksu: ${{ steps.v.outputs.ksu }}
      nomount: ${{ steps.v.outputs.nomount }}
      guard: ${{ steps.v.outputs.guard }}
      susfs: ${{ steps.v.outputs.susfs }}
      bbrv3: ${{ steps.v.outputs.bbrv3 }}
      fragments: ${{ steps.v.outputs.fragments }}
      extra_config: ${{ steps.v.outputs.extra_config }}
      branch: ${{ steps.v.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          VARIANT_IN: ${{ inputs.variant }}
          BRANCH_IN: ${{ inputs.branch }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$VARIANT_IN" ]; then V="$VARIANT_IN"; else V="plain"; fi
          [ -f "variants/$V.json" ] || { echo "unknown variant: $V"; exit 2; }
          J=$(cat "variants/$V.json")
          get() { jq -r ".defaults[\"$1\"] | if type == \"boolean\" then tostring else . // \"\" end" <<<"$J"; }
          echo "our_revision=$(get our_revision)" >>"$GITHUB_OUTPUT"
          echo "ksu=$(get ksu)" >>"$GITHUB_OUTPUT"
          echo "nomount=$(get nomount)" >>"$GITHUB_OUTPUT"
          echo "guard=$(get guard)" >>"$GITHUB_OUTPUT"
          echo "susfs=$(get susfs)" >>"$GITHUB_OUTPUT"
          echo "bbrv3=$(get bbrv3)" >>"$GITHUB_OUTPUT"
          for c in nomount_ref guard_ref; do
            n=$(jq -r ".branches[].$c // \"\"" <<<"$J" | sort -u | grep -c . || true)
            [ "$n" -le 1 ] || { echo "parity: $c differs across branches"; exit 2; }
          done
          echo "fragments=$(get fragments)" >>"$GITHUB_OUTPUT"
          echo "extra_config=$(get extra_config)" >>"$GITHUB_OUTPUT"
          if [ -z "$BRANCH_IN" ] || [ "$BRANCH_IN" = "all" ]; then B="all"; else B="$BRANCH_IN"; fi
          echo "branch=$B" >>"$GITHUB_OUTPUT"
          if [ "$B" = "all" ]; then
            M=$(jq -c '{include: [.branches[] | {our_branch: .branch, fallback_branch: .fallback, manifest_branch: .manifest, build_kind: .kind, ksu_ref: .ksu_ref, susfs_ref: (.susfs_ref // ""), nomount_ref: (.nomount_ref // ""), guard_ref: (.guard_ref // "")}]}' <<<"$J")
          else
            M=$(jq -c --arg o "$B" '{include: [.branches[] | select(.branch == $o or .fallback == $o) | {our_branch: .branch, fallback_branch: .fallback, manifest_branch: .manifest, build_kind: .kind, ksu_ref: .ksu_ref, susfs_ref: (.susfs_ref // ""), nomount_ref: (.nomount_ref // ""), guard_ref: (.guard_ref // "")}]}' <<<"$J")
            [ "$(jq '.include | length' <<<"$M")" -gt 0 ] || { echo "no variant branch matches: $B"; exit 2; }
          fi
          echo "matrix=$M" >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          V="${{ inputs.variant }}"; [ -n "$V" ] || V=plain
          J=$(cat "variants/$V.json")
          {
            echo "## Variant \`$V\` → branch \`${{ steps.v.outputs.branch }}\`"
            echo ""
            echo "| branch | ksu | susfs | nomount | guard |"
            echo "|---|---|---|---|---|"
            jq -r '.branches[] | "| \(.branch) | \(.ksu_ref[0:8]) | \((.susfs_ref // "")[0:8]) | \((.nomount_ref // "")[0:8]) | \((.guard_ref // "")[0:8]) |"' <<<"$J"
            echo ""
            echo "- ksu=${{ steps.v.outputs.ksu }} susfs=${{ steps.v.outputs.susfs }} bbrv3=${{ steps.v.outputs.bbrv3 }} nomount=${{ steps.v.outputs.nomount }} guard=${{ steps.v.outputs.guard }} fragments=${{ steps.v.outputs.fragments }}"
            echo "- release=${{ inputs.release }} (Telegram always on release)"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Free disk space
        run: |
          sudo bash "$GITHUB_WORKSPACE/builder/tools/free-disk-space.sh"
          df -h

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Pick revision
        id: rev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ needs.resolve.outputs.our_revision }}
          WANT: ${{ matrix.our_branch }}
          FALLBACK: ${{ matrix.fallback_branch }}
        run: |
          if [ "$OVERRIDE" = "lts" ]; then REV="$FALLBACK"; elif [ -n "$OVERRIDE" ]; then REV="$OVERRIDE"; else
            if git ls-remote --heads "https://github.com/sysretq0/android-kernel-common" "$WANT" | grep -q .; then REV="$WANT"; else REV="$FALLBACK"; fi
          fi
          echo "rev=$REV" >>"$GITHUB_OUTPUT"
          echo "Building common@$REV"

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin && curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo && echo "$HOME/.bin" >>"$GITHUB_PATH"

      - name: repo init + vendor our common
        run: |
          mkdir -p kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b "${{ matrix.manifest_branch }}" --depth=1
          mkdir -p .repo/local_manifests
          sed "s/__REVISION__/${{ steps.rev.outputs.rev }}/" "$GITHUB_WORKSPACE/builder/manifests/vendor-common.xml.template" > .repo/local_manifests/vendor-common.xml
          cat .repo/local_manifests/vendor-common.xml

      - name: repo sync (minimal)
        run: |
          cd kernel
          repo sync -c -j$(nproc) --no-tags --fail-fast

      - name: Integrate KernelSU-Next
        if: needs.resolve.outputs.ksu != 'false'
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-kernelsu-next.sh" --ref "${{ matrix.ksu_ref }}"

      - name: Integrate SuSFS
        if: needs.resolve.outputs.susfs != 'false'
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-susfs.sh" \
            --our-branch "${{ matrix.our_branch }}" --ref "${{ matrix.susfs_ref }}"

      - name: Integrate BBRv3
        if: needs.resolve.outputs.bbrv3 != 'false'
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-bbrv3.sh" \
            --our-branch "${{ matrix.our_branch }}" \
            --patch-dir "$GITHUB_WORKSPACE/builder/patches/bbrv3"

      - name: Integrate NoMount
        if: needs.resolve.outputs.nomount != 'false'
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-nomount.sh" --ref "${{ matrix.nomount_ref }}"

      - name: Integrate Partition Guard
        if: needs.resolve.outputs.guard != 'false'
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/setup-partition-guard.sh" --ref "${{ matrix.guard_ref }}"

      - name: Apply config fragments (build.sh era)
        if: matrix.build_kind == 'build_sh' && (needs.resolve.outputs.fragments != 'false' || needs.resolve.outputs.extra_config != '')
        run: |
          cd kernel
          ARGS=(--kernel-dir common)
          if [ "${{ needs.resolve.outputs.fragments }}" != "false" ]; then
            [ -d "$GITHUB_WORKSPACE/builder/fragments/common" ] &&
              ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/common")
            [ -d "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}" ] &&
              ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}")
            [ -d .fragments ] && ARGS+=(--fragment-dir .fragments)
          fi
          [ -n "${{ needs.resolve.outputs.extra_config }}" ] &&
            ARGS+=(--extra-config "${{ needs.resolve.outputs.extra_config }}")
          bash "$GITHUB_WORKSPACE/builder/tools/apply-fragments.sh" "${ARGS[@]}"

      - name: Stage Kleaf fragments
        id: kleaf_frag
        if: matrix.build_kind == 'kleaf' && (needs.resolve.outputs.fragments != 'false' || needs.resolve.outputs.extra_config != '')
        run: |
          cd kernel
          ARGS=(--kernel-dir common)
          if [ "${{ needs.resolve.outputs.fragments }}" != "false" ]; then
            [ -d "$GITHUB_WORKSPACE/builder/fragments/common" ] &&
              ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/common")
            [ -d "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}" ] &&
              ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}")
            [ -d .fragments ] && ARGS+=(--fragment-dir .fragments)
          fi
          [ -n "${{ needs.resolve.outputs.extra_config }}" ] &&
            ARGS+=(--extra-config "${{ needs.resolve.outputs.extra_config }}")
          bash "$GITHUB_WORKSPACE/builder/tools/stage-kleaf-fragments.sh" "${ARGS[@]}"
          [ -f common/builder_fragments.config ] && echo "has=true" >>"$GITHUB_OUTPUT" || echo "has=false" >>"$GITHUB_OUTPUT"

      - name: Drop stale module outs
        if: matrix.build_kind == 'kleaf'
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/drop-stale-module-outs.sh" \
            --tree common --kversion 6.12 --when-symbol CONFIG_CIFS \
            --drop fs/netfs/netfs.ko
          bash "$GITHUB_WORKSPACE/builder/tools/drop-stale-module-outs.sh" \
            --tree common --kversion 6.18 --when-symbol CONFIG_CIFS \
            --drop fs/netfs/netfs.ko --drop lib/crypto/libarc4.ko

      - name: Dump resolved config
        if: matrix.build_kind == 'kleaf'
        run: |
          cd kernel
          tools/bazel build --defconfig_fragment=//common:builder_fragments //common:kernel_aarch64_config 2>&1 | tail -3 || true
          CFG=""
          for f in $(find bazel-bin/common/kernel_aarch64_config -type f 2>/dev/null); do
            if grep -qm1 "Kernel Configuration" "$f" 2>/dev/null; then CFG="$f"; break; fi
          done
          if [ -n "$CFG" ]; then
            ARGS=(--config "$CFG")
            [ -d "$GITHUB_WORKSPACE/builder/fragments/common" ] &&
              ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/common")
            [ -d "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}" ] &&
              ARGS+=(--fragment-dir "$GITHUB_WORKSPACE/builder/fragments/${{ matrix.our_branch }}")
            [ -d .fragments ] && ARGS+=(--fragment-dir .fragments)
            bash "$GITHUB_WORKSPACE/builder/tools/dump-resolved-config.sh" "${ARGS[@]}"
          else
            echo "dump-resolved-config: no Kconfig file found under kernel_aarch64_config/"
          fi

      - name: Commit tree
        run: |
          cd kernel
          if [ -d common/.git ]; then
            git -C common add -A 2>/dev/null || true
            git -C common diff --cached --quiet 2>/dev/null || \
              git -C common -c user.name="android-kernel-builder" \
                -c user.email="builder@localhost" \
                commit -qm "builder: commit tree before build (avoid -dirty)" || true
            git -C common status --short | head -5
          fi

      - name: Prepare portable build config (build.sh era)
        if: matrix.build_kind == 'build_sh'
        run: |
          cd kernel
          cp "$GITHUB_WORKSPACE/builder/tools/self-heal-config.sh" build/self-heal-config.sh
          chmod +x build/self-heal-config.sh
          cat > build.config.portable <<'EOF'
          export KERNEL_DIR=common
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64
          export POST_DEFCONFIG_CMDS='${ROOT_DIR}/build/self-heal-config.sh'
          EOF
          cat build.config.portable

      - name: Build (build.sh era)
        if: matrix.build_kind == 'build_sh'
        run: |
          cd kernel
          BUILD_CONFIG=build.config.portable build/build.sh

      - name: Build (Kleaf era)
        if: matrix.build_kind == 'kleaf'
        run: |
          cd kernel
          FLAG=""
          [ "${{ steps.kleaf_frag.outputs.has }}" = "true" ] &&
            FLAG="--defconfig_fragment=//common:builder_fragments"
          # shellcheck disable=SC2086
          tools/bazel build $FLAG //common:kernel_aarch64_dist

      - name: Verify SuSFS
        if: needs.resolve.outputs.susfs != 'false'
        run: |
          cd kernel
          bash "$GITHUB_WORKSPACE/builder/tools/verify-susfs.sh" --kind "${{ matrix.build_kind }}"

      - name: Collect outputs
        run: |
          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}"
          for f in $(find out bazel-bin/common -maxdepth 4 \( -name "Image*" -o -name "vmlinux" -o -name "System.map" \) 2>/dev/null | head -n 20); do
            cp -v "$f" "$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}/" 2>/dev/null || true
          done
          ls -la "$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}/"

      - name: Pack AnyKernel3 zip
        run: |
          OUT="$GITHUB_WORKSPACE/out-${{ steps.rev.outputs.rev }}"
          IMG=""
          for cand in Image Image.gz Image.lz4; do
            [ -f "$OUT/$cand" ] && IMG="$OUT/$cand" && break
          done
          [ -n "$IMG" ] || { echo "no kernel image for AK3 zip; skipping"; exit 0; }
          KCONFIG=$(bash "$GITHUB_WORKSPACE/builder/tools/pick-config.sh" --kind "${{ matrix.build_kind }}" 2>/dev/null || true)
          [ -n "$KCONFIG" ] && echo "ak3 kconfig: $KCONFIG" || echo "ak3 kconfig: none found, skipping"
          IKCONFIG=""
          if [ -x common/scripts/extract-ikconfig ]; then
            if common/scripts/extract-ikconfig "$IMG" > /tmp/ikconfig 2>/dev/null; then
              IKCONFIG=/tmp/ikconfig
              echo "ak3 ikconfig: extracted from image"
            else
              echo "ak3 ikconfig: extract failed, skipping"
            fi
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          REV="${{ steps.rev.outputs.rev }}"
          SUBLEVEL=$(grep -E '^SUBLEVEL = ' kernel/common/Makefile | awk '{print $3}')
          ZIPREV="$REV"
          if [ -n "$SUBLEVEL" ]; then
            BASE="${REV%-stable}"; BASE="${BASE%-lts}"
            ZIPREV="$BASE-$SUBLEVEL${REV#$BASE}"
          fi
          echo "zip revision: $ZIPREV"
          INT=""; [ "${{ needs.resolve.outputs.ksu }}" = "true" ] && INT="${INT}KernelSU-Next:";
          [ "${{ needs.resolve.outputs.susfs }}" = "true" ] && INT="${INT}SuSFS:";
          [ "${{ needs.resolve.outputs.nomount }}" = "true" ] && INT="${INT}NoMount:";
          [ "${{ needs.resolve.outputs.guard }}" = "true" ] && INT="${INT}Partition Guard:";
          FRAGS=$(cd "$GITHUB_WORKSPACE/builder/fragments/common" && ls *.config 2>/dev/null | sed 's/\.config$//' | paste -sd: -)
          bash "$GITHUB_WORKSPACE/builder/tools/pack-anykernel.sh" \
            --image "$IMG" --rev "$ZIPREV" \
            --features "${INT}${FRAGS}" --kconfig "$KCONFIG" --ikconfig "$IKCONFIG" \
            --out "$GITHUB_WORKSPACE/release/anykernel-$ZIPREV.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.rev.outputs.rev }}
          path: out-${{ steps.rev.outputs.rev }}/
          if-no-files-found: warn

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: anykernel-${{ steps.rev.outputs.rev }}
          path: release/
          if-no-files-found: ignore

      - name: Stage KSU version
        if: needs.resolve.outputs.ksu != 'false'
        run: |
          [ -f kernel/.ksu-version ] \
            && cp kernel/.ksu-version "ksu-version-${{ steps.rev.outputs.rev }}.txt" \
            || echo "no ksu version file; upload will skip"
      - name: Upload KSU version
        if: needs.resolve.outputs.ksu != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ksu-version-${{ steps.rev.outputs.rev }}
          path: ksu-version-${{ steps.rev.outputs.rev }}.txt
          if-no-files-found: ignore

      - name: Stage NoMount version
        if: needs.resolve.outputs.nomount != 'false'
        run: |
          [ -f kernel/.nomount-version ] \
            && cp kernel/.nomount-version "nomount-version-${{ steps.rev.outputs.rev }}.txt" \
            || echo "no nomount version file; upload will skip"
      - name: Upload NoMount version
        if: needs.resolve.outputs.nomount != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nomount-version-${{ steps.rev.outputs.rev }}
          path: nomount-version-${{ steps.rev.outputs.rev }}.txt
          if-no-files-found: ignore

      - name: Stage Guard version
        if: needs.resolve.outputs.guard != 'false'
        run: |
          [ -f kernel/.guard-version ] \
            && cp kernel/.guard-version "guard-version-${{ steps.rev.outputs.rev }}.txt" \
            || echo "no guard version file; upload will skip"
      - name: Upload Guard version
        if: needs.resolve.outputs.guard != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: guard-version-${{ steps.rev.outputs.rev }}
          path: guard-version-${{ steps.rev.outputs.rev }}.txt
          if-no-files-found: ignore

      - name: Stage SuSFS version
        if: needs.resolve.outputs.susfs != 'false'
        run: |
          [ -f kernel/.susfs-version ] \
            && cp kernel/.susfs-version "susfs-version-${{ steps.rev.outputs.rev }}.txt" \
            || echo "susfs gated or skipped here; upload will skip"
      - name: Upload SuSFS version
        if: needs.resolve.outputs.susfs != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: susfs-version-${{ steps.rev.outputs.rev }}
          path: susfs-version-${{ steps.rev.outputs.rev }}.txt
          if-no-files-found: ignore

      - name: Stage BBRv3 version
        if: needs.resolve.outputs.bbrv3 != 'false'
        run: |
          [ -f kernel/.bbrv3-version ] \
            && cp kernel/.bbrv3-version "bbrv3-version-${{ steps.rev.outputs.rev }}.txt" \
            || echo "bbrv3 gated here (no proven backport); upload will skip"
      - name: Upload BBRv3 version
        if: needs.resolve.outputs.bbrv3 != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: bbrv3-version-${{ steps.rev.outputs.rev }}
          path: bbrv3-version-${{ steps.rev.outputs.rev }}.txt
          if-no-files-found: ignore

  release:
    needs: [resolve, build]
    if: ${{ !cancelled() && inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch AnyKernel3 zips
        uses: actions/download-artifact@v4
        with:
          pattern: anykernel-*
          path: zips
          merge-multiple: true
      - name: Fetch KSU versions
        uses: actions/download-artifact@v4
        with:
          pattern: ksu-version-*
          path: ksuversions
          merge-multiple: true
        continue-on-error: true
      - name: Fetch SuSFS versions
        uses: actions/download-artifact@v4
        with:
          pattern: susfs-version-*
          path: susfsversions
          merge-multiple: true
        continue-on-error: true
      - name: Fetch BBRv3 versions
        uses: actions/download-artifact@v4
        with:
          pattern: bbrv3-version-*
          path: bbrv3versions
          merge-multiple: true
        continue-on-error: true
      - name: Fetch NoMount versions
        uses: actions/download-artifact@v4
        with:
          pattern: nomount-version-*
          path: nomountversions
          merge-multiple: true
        continue-on-error: true
      - name: Fetch Guard versions
        uses: actions/download-artifact@v4
        with:
          pattern: guard-version-*
          path: guardversions
          merge-multiple: true
        continue-on-error: true
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(zips/*.zip)
          [ "${#files[@]}" -gt 0 ] || { echo "no AnyKernel3 zips; skipping release"; exit 0; }
          TAG="kernel-build-r${{ github.run_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FRAGS_C=$(cd "$GITHUB_WORKSPACE/builder/fragments/common" && ls *.config 2>/dev/null | sed 's/\.config$//' | tr '\n' ' ')
          FRAGS_B=$(cd "$GITHUB_WORKSPACE/builder/fragments" && for d in android*; do [ -d "$d" ] || continue; for f in "$d"/*.config; do echo "$d:${f##*/}"; done 2>/dev/null | sed 's/\.config$//'; done | tr '\n' ' ')
          MANAGER_URL="https://nightly.link/KernelSU-Next/KernelSU-Next/workflows/build-manager-ci/dev/manager.zip"
          MANAGER_PIN="dev tip"
          if [ "${{ needs.resolve.outputs.ksu }}" != "false" ]; then
            WID=$(gh api repos/KernelSU-Next/KernelSU-Next/actions/workflows --jq '.workflows[] | select(.path==".github/workflows/build-manager-ci.yml") | .id' 2>/dev/null || true)
            if [ -n "$WID" ]; then
              for PSHA in $(for vf in ksuversions/ksu-version-*.txt; do [ -f "$vf" ] && awk '{print $2}' "$vf"; done | sort | uniq -c | sort -rn | awk '{print $2}'); do
                RID=$(gh api "repos/KernelSU-Next/KernelSU-Next/actions/workflows/$WID/runs?branch=dev&status=success&per_page=100" --jq ".workflow_runs[] | select(.head_sha | startswith(\"$PSHA\")) | .id" 2>/dev/null | head -1 || true)
                if [ -n "$RID" ]; then
                  MANAGER_URL="https://nightly.link/KernelSU-Next/KernelSU-Next/actions/runs/$RID/manager.zip"
                  MANAGER_PIN="pinned run $RID"
                  break
                fi
              done
            fi
          fi
          TAG="kernel-build-r${{ github.run_number }}" \
          VARIANT="${{ inputs.variant }}" \
          IN_KSU="${{ needs.resolve.outputs.ksu }}" IN_SUSFS="${{ needs.resolve.outputs.susfs }}" \
          IN_BBRV3="${{ needs.resolve.outputs.bbrv3 }}" IN_NOMOUNT="${{ needs.resolve.outputs.nomount }}" \
          IN_GUARD="${{ needs.resolve.outputs.guard }}" \
          FRAGS_COMMON="$FRAGS_C" FRAGS_BRANCH="$FRAGS_B" \
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          REPO="${{ github.repository }}" \
          MANAGER_URL="$MANAGER_URL" MANAGER_PIN="$MANAGER_PIN" \
          python3 "$GITHUB_WORKSPACE/builder/tools/render-release.py" \
            ksuversions susfsversions bbrv3versions nomountversions guardversions zips \
            "$GITHUB_WORKSPACE/builder/docs/RELEASE_NOTES_EXTRA.txt" \
            release-notes.md tg-table.txt tg-extras.txt
          HL=$(git -C "$GITHUB_WORKSPACE/builder" log -1 --format=%s 2>/dev/null || echo "New build")
          HLESC=$(printf '%s' "$HL" | python3 -c 'import html,sys; print(html.escape(sys.stdin.read()), end="")' | sed 's/[&|\\/]/\\&/g')
          printf '%s\n' "${files[@]##*/}" > /tmp/tg_files.txt
          sed -e "s|{KERNEL NAME}|GKI Kernel|" \
              -e "s|{VERSION}|$TAG|" \
              -e "s|{release URL}|https://github.com/${{ github.repository }}/releases/tag/$TAG|" \
              -e "s|{how to flash}|Flash the zip matching your branch in recovery or KernelSU manager|" \
              -e "s|{backup warning}|Back up boot first — no auto-backup|" \
              -e "s|{HEADLINE}|$HLESC|" \
              -e "/{one file per line}/r /tmp/tg_files.txt" -e "/{one file per line}/d" \
              -e "/{TABLE}/r tg-table.txt" -e "/{TABLE}/d" \
              -e "/{EXTRAS}/r tg-extras.txt" -e "/{EXTRAS}/d" \
              "$GITHUB_WORKSPACE/builder/docs/TELEGRAM_RELEASE.md" > telegram-post.txt
          EXTRA="$GITHUB_WORKSPACE/builder/docs/RELEASE_NOTES_EXTRA.txt"
          if [ -s "$EXTRA" ]; then
            python3 "$GITHUB_WORKSPACE/builder/tools/telegram-notes.py" "$EXTRA" telegram-post.txt
          fi
          echo "--- telegram-post.txt ---"; cat telegram-post.txt; echo "--- end ---"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" telegram-post.txt --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "${files[@]}" telegram-post.txt --prerelease \
              --title "$TAG" --notes-file release-notes.md --repo "${{ github.repository }}"
          fi
      - name: Notify Telegram channel
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_FWD: ${{ secrets.TELEGRAM_FORWARD_CHAT_ID }}
          TG_TOPIC: ${{ secrets.TELEGRAM_FORWARD_TOPIC_ID }}
          FWD_ON: ${{ inputs.forward }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "telegram secrets unset; skipping"; exit 0; }
          [ -f telegram-post.txt ] || { echo "no telegram post; skipping"; exit 0; }
          RESP=$(curl -sf --max-time 30 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$(cat telegram-post.txt)") \
            && echo "telegram posted" || { echo "telegram post FAILED"; exit 1; }
          MID=$(printf '%s' "$RESP" | grep -o '"message_id":[0-9]*' | head -1 | cut -d: -f2)
          if [ "${FWD_ON:-false}" = "true" ] && [ -n "${TG_FWD:-}" ] && [ -n "$MID" ]; then
            FWD_FAIL=""
            NSPEC=$(printf '%s' "$TG_FWD" | awk -F, '{print NF}')
            OLDIFS=$IFS; IFS=,
            for spec in $TG_FWD; do
              chat="${spec%%:*}"; topic="${spec#*:}"
              if [ "$topic" = "$spec" ]; then
                if [ "$NSPEC" = "1" ]; then topic="${TG_TOPIC:-}"; else topic=""; fi
              fi
              [ -z "$chat" ] && continue
              FWD_ARGS=()
              [ -n "$topic" ] && FWD_ARGS+=(--data-urlencode "message_thread_id=${topic}")
              if curl -sf --max-time 30 -X POST "https://api.telegram.org/bot${TG_TOKEN}/forwardMessage" \
                --data-urlencode "chat_id=${chat}" \
                --data-urlencode "from_chat_id=${TG_CHAT}" \
                --data-urlencode "message_id=${MID}" "${FWD_ARGS[@]}" > /dev/null; then
                echo "telegram forwarded to $chat${topic:+ topic $topic}"
              else
                echo "telegram forward FAILED for $chat${topic:+ topic $topic} (is the bot in there with post rights?)"
                FWD_FAIL="${FWD_FAIL} $chat"
              fi
            done
            IFS=$OLDIFS
            [ -z "$FWD_FAIL" ] || { echo "forward failures:$FWD_FAIL"; exit 1; }
          else
            echo "no forward chat configured; skipping"
          fi
