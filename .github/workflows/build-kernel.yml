name: build-kernel
on:
  workflow_dispatch:
    inputs:
      variant:
        default: plain
        required: true
      branch:
        default: all
        required: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: python3 tools/matrix.py "${{ inputs.variant }}" "${{ inputs.branch }}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Sync tree
        run: |
          mkdir -p work
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "${{ matrix.manifest }}" --depth=1 --groups=all
          repo sync -c --no-tags -j"$(nproc)"
        working-directory: work

      - name: Stage added config
        run: python3 builder/tools/stage_fragments.py "${{ matrix.kind }}"

      - name: Commit tree
        run: |
          if [ -d common/.git ]; then
            git -C common add -A 2>/dev/null || true
            git -C common diff --cached --quiet 2>/dev/null || \
              git -C common -c user.name="android-kernel-builder" \
                -c user.email="builder@localhost" \
                commit -qm "builder: commit tree before build (avoid -dirty)" || true
          fi
        working-directory: work

      - name: Build (build.sh era)
        if: matrix.kind == 'build_sh'
        run: bash build/build.sh
        working-directory: work
        env:
          BUILD_CONFIG: common/build.config.gki.aarch64

      - name: Build (Kleaf era)
        if: matrix.kind == 'kleaf'
        run: |
          FLAG=""
          [ -f common/builder_fragments.config ] && FLAG="--defconfig_fragment=//common:builder_fragments"
          # shellcheck disable=SC2086
          tools/bazel build $FLAG //common:kernel_aarch64_dist
        working-directory: work

      - name: Collect images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-${{ matrix.branch }}"
          find out bazel-bin -name 'Image*' -type f -exec cp {} "$GITHUB_WORKSPACE/out-${{ matrix.branch }}/" \; 2>/dev/null || true
          ls "$GITHUB_WORKSPACE/out-${{ matrix.branch }}"
        working-directory: work

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images-${{ matrix.branch }}
          path: out-${{ matrix.branch }}/
          if-no-files-found: warn
