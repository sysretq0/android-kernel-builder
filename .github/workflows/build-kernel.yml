name: build-kernel
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to build
        default: plain
        required: true
        type: choice
        options:
          - plain
      destination:
        description: Where the outputs go
        default: artifact
        required: true
        type: choice
        options:
          - artifact
          - release
      branch:
        description: Branch to build (or all)
        default: all
        required: false
        type: choice
        options:
          - all
          - android12-5.10-lts
          - android13-5.10-lts
          - android13-5.15-lts
          - android14-5.15-lts
          - android14-6.1-lts
          - android15-6.6-lts
          - android16-6.12-lts
          - android17-6.18-lts

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: python3 tools/matrix.py "${{ inputs.variant }}" "${{ inputs.branch }}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Prepare runner (disk + swap)
        run: |
          sudo bash "$GITHUB_WORKSPACE/builder/tools/free-disk-space.sh"
          df -h

      - name: Sync tree
        run: |
          mkdir -p work && cd work
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "${{ matrix.manifest }}" --depth=1 --groups=all
          mkdir -p .repo/local_manifests
          sed "s/__REVISION__/${{ matrix.branch }}/" \
            "$GITHUB_WORKSPACE/builder/manifests/vendor-common.xml.template" \
            > .repo/local_manifests/vendor-common.xml
          repo sync -c --no-tags -j"$(nproc)"

      - name: Integrate features
        run: python3 ../builder/tools/integrate.py "${{ inputs.variant }}" "${{ matrix.branch }}"
        working-directory: work

      - name: Stage added config
        run: python3 ../builder/tools/stage_fragments.py "${{ matrix.kind }}" "${{ inputs.variant }}" "${{ matrix.branch }}"
        working-directory: work

      - name: Drop stale module outs
        if: matrix.kind == 'kleaf'
        run: |
          bash ../builder/tools/drop-stale-module-outs.sh \
            --tree common --kversion 6.12 --when-symbol CONFIG_CIFS \
            --drop fs/netfs/netfs.ko
          bash ../builder/tools/drop-stale-module-outs.sh \
            --tree common --kversion 6.18 --when-symbol CONFIG_CIFS \
            --drop fs/netfs/netfs.ko --drop lib/crypto/libarc4.ko
        working-directory: work

      - name: Build
        run: python3 ../builder/tools/build_kernel.py "${{ matrix.kind }}"
        working-directory: work

      - name: Collect images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-${{ matrix.branch }}"
          find out bazel-bin -name 'Image*' -type f -exec cp {} "$GITHUB_WORKSPACE/out-${{ matrix.branch }}/" \; 2>/dev/null || true
          ls "$GITHUB_WORKSPACE/out-${{ matrix.branch }}"
        working-directory: work

      - name: Collect versions
        run: python3 ../builder/tools/collect-versions.py "${{ matrix.branch }}"
        working-directory: work

      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images-${{ matrix.branch }}
          path: out-${{ matrix.branch }}/
          if-no-files-found: warn

      - name: Upload versions
        uses: actions/upload-artifact@v4
        with:
          name: versions-${{ matrix.branch }}
          path: versions-${{ matrix.branch }}/
          if-no-files-found: warn
          if-no-files-found: warn
