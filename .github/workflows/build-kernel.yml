name: build-kernel
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to build
        default: plain
        required: true
        type: choice
        options:
          - plain
          - susfs
      destination:
        description: Where the outputs go
        default: artifact
        required: true
        type: choice
        options:
          - artifact
          - release
      cleanup:
        description: Runner disk cleanup (force ignores the free-space goal)
        default: auto
        required: false
        type: choice
        options:
          - auto
          - force
      branch:
        description: Branch to build (or all)
        default: all
        required: false
        type: choice
        options:
          - all
          - android12-5.10-lts
          - android13-5.10-lts
          - android13-5.15-lts
          - android14-5.15-lts
          - android14-6.1-lts
          - android15-6.6-lts
          - android16-6.12-lts
          - android17-6.18-lts
      clang:
        description: Override build_sh clang with pinned release compiler
        default: false
        required: false
        type: boolean

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: r
        run: python3 tools/matrix.py "${{ inputs.variant }}" "${{ inputs.branch }}" "${{ inputs.clang }}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: builder

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Prepare runner (disk + swap)
        env:
          FD_FORCE: ${{ inputs.cleanup == 'force' && '1' || '' }}
        run: |
          sudo -E bash "$GITHUB_WORKSPACE/builder/tools/free-disk-space.sh"
          df -h

      - name: Sync tree
        run: |
          mkdir -p work && cd work
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "${{ matrix.manifest }}" --depth=1 --groups=all
          mkdir -p .repo/local_manifests
          sed "s/__REVISION__/${{ matrix.branch }}/" \
            "$GITHUB_WORKSPACE/builder/manifests/vendor-common.xml.template" \
            > .repo/local_manifests/vendor-common.xml
          if [ -n "${{ matrix.clang }}" ]; then
            sed -i 's|</manifest>|  <remove-project name="platform/prebuilts/clang/host/linux-x86" />\n</manifest>|' \
              .repo/local_manifests/vendor-common.xml
          fi
          repo sync -c --no-tags -j"$(nproc)"

      - name: Setup clang override
        if: matrix.clang != ''
        run: python3 ../builder/tools/setup-clang.py "${{ matrix.clang }}" "${{ github.repository }}"
        working-directory: work

      - name: Prove clang present
        if: matrix.clang != ''
        run: |
          ls -la "$CLANG_DIR/clang" "$CLANG_DIR/clang++" 2>&1 | head -5
          "$CLANG_DIR/clang" --version | head -1
          df -h . | tail -1

      - name: Integrate features
        run: python3 ../builder/tools/integrate.py "${{ inputs.variant }}" "${{ matrix.branch }}"
        working-directory: work

      - name: Stage added config
        run: python3 ../builder/tools/stage_fragments.py "${{ matrix.kind }}" "${{ inputs.variant }}" "${{ matrix.branch }}"
        working-directory: work

      - name: Drop stale module outs
        if: matrix.kind == 'kleaf'
        run: python3 ../builder/tools/run-drops.py
        working-directory: work

      - name: Build
        run: python3 ../builder/tools/build_kernel.py "${{ matrix.kind }}"
        working-directory: work

      - name: Collect images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-${{ matrix.branch }}"
          find out bazel-bin -name 'Image*' -type f -exec cp {} "$GITHUB_WORKSPACE/out-${{ matrix.branch }}/" \; 2>/dev/null || true
          CFG=$(find out bazel-bin/common -maxdepth 6 -name .config 2>/dev/null | sort | head -1 || true)
          [ -n "$CFG" ] && cp "$CFG" "$GITHUB_WORKSPACE/out-${{ matrix.branch }}/kernel.config" || echo "no resolved .config found"
          ls "$GITHUB_WORKSPACE/out-${{ matrix.branch }}"
        working-directory: work

      - name: Collect versions
        run: python3 ../builder/tools/collect-versions.py "${{ matrix.branch }}"
        working-directory: work

      - name: Pack AnyKernel3
        run: |
          REV=$(cat "versions-${{ matrix.branch }}/rev.txt")
          IMG=""
          for cand in Image Image.gz Image.lz4; do
            [ -f "out-${{ matrix.branch }}/$cand" ] && IMG="out-${{ matrix.branch }}/$cand" && break
          done
          [ -n "$IMG" ] || { echo "no kernel image; skipping pack"; exit 0; }
          FEATS=$(python3 builder/tools/ak3-features.py --versions-dir "versions-${{ matrix.branch }}" --builder builder --variant "${{ inputs.variant }}" --branch "${{ matrix.branch }}")
          KC=""; [ -f "out-${{ matrix.branch }}/kernel.config" ] && KC="--kconfig out-${{ matrix.branch }}/kernel.config"
          # shellcheck disable=SC2086
          bash builder/tools/pack-anykernel.sh --image "$IMG" --rev "$REV" \
            --features "$FEATS" --akdir builder/anykernel $KC \
            --out "$GITHUB_WORKSPACE/zips/anykernel-$REV.zip"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v7.0.1
        with:
          name: anykernel-${{ matrix.branch }}
          path: zips/
          if-no-files-found: warn

      - name: Upload versions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: versions-${{ matrix.branch }}
          path: versions-${{ matrix.branch }}/
          if-no-files-found: warn

  release:
    needs: build
    if: inputs.destination == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: builder
      - name: Fetch zips
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: anykernel-*
          path: zips
          merge-multiple: true
      - name: Fetch versions
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: versions-*
          path: versions
      - name: Publish release + Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python3 builder/tools/publish-release.py
          --tag "kernel-build-r${{ github.run_number }}"
          --variant "${{ inputs.variant }}" --repo "${{ github.repository }}"
          --zips zips --versions versions --builder builder
